services:
  postgres:
    image: postgres:18.6-alpine
    container_name: apivault-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apivault}
      POSTGRES_DB: ${POSTGRES_DB:-apivault}
    ports:
      - "5432:5432"
    volumes:
      - apivault_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apivault -d apivault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apivault_postgres_data:
