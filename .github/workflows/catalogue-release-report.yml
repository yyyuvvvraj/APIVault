name: Catalogue release-count report

on:
  workflow_dispatch:
    inputs:
      enforce_1000:
        description: Fail unless at least 1,000 eligible APIs are present
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  report:
    name: Generate evidence-backed catalogue count
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.APIVAULT_REPORT_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Configure APIVAULT_REPORT_DATABASE_URL before generating the Prisma client."
            exit 1
          fi
          npm run db:generate

      - name: Generate catalogue report
        env:
          DATABASE_URL: ${{ secrets.APIVAULT_REPORT_DATABASE_URL }}
          ENFORCE_1000: ${{ inputs.enforce_1000 }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Configure APIVAULT_REPORT_DATABASE_URL before running this workflow."
            exit 1
          fi
          npm run --silent catalogue:report > catalogue-release-report.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("catalogue-release-report.json", "utf8"));
            console.log(JSON.stringify({
              generatedAt: report.generatedAt,
              totalRecords: report.totalRecords,
              eligibleCount: report.eligibleCount,
              excludedCount: report.excludedCount
            }, null, 2));
            if (process.env.ENFORCE_1000 === "true" && report.eligibleCount < 1000) {
              console.error("v0.5.0 catalogue gate failed: fewer than 1,000 eligible APIs.");
              process.exit(1);
            }
          '

      - name: Upload count evidence
        if: always() && hashFiles('catalogue-release-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: apivault-catalogue-release-report-${{ github.run_id }}
          path: catalogue-release-report.json
          if-no-files-found: error
          retention-days: 90
