name: Application CI

on:
  pull_request:
  push:
    branches: [dev, stable, "feature/**", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: apivault
          POSTGRES_PASSWORD: apivault
          POSTGRES_DB: apivault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apivault -d apivault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apivault:apivault@localhost:5432/apivault?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate base Prisma Client
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
        run: npm run db:generate

      - name: Generate Better Auth Prisma schema
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
          BETTER_AUTH_SECRET: ci-only-secret-not-used-for-real-sessions-1234567890
          BETTER_AUTH_URL: http://localhost:3000
        run: npx auth@latest generate --adapter prisma --dialect postgresql --yes

      - name: Regenerate Prisma Client with auth models
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Unit tests
        run: npm test

      - name: Database integration tests
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
          BETTER_AUTH_SECRET: ci-only-secret-not-used-for-real-sessions-1234567890
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
