name: Application CI

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          DATABASE_URL: postgresql://apivault@localhost:5432/apivault?schema=public
          BETTER_AUTH_SECRET: ci-only-secret-not-used-for-real-sessions-1234567890
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
