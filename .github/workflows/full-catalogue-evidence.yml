name: Full catalogue evidence processing

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/full-catalogue-evidence.yml"
      - "scripts/catalogue-high-priority-research.py"
      - "scripts/tests/test_catalogue_high_priority_research.py"
      - "services/catalogue-importer/**"
  workflow_dispatch:
    inputs:
      expected_leads:
        description: Expected number of pinned discovery leads (safety check)
        required: true
        default: "2284"
        type: string
      batch_size:
        description: Leads per bounded hostname research batch
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: apivault-full-catalogue-evidence
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable discovery queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.batches.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/catalogue-importer/go.mod
          cache-dependency-path: services/catalogue-importer/go.sum
      - name: Validate tooling
        working-directory: services/catalogue-importer
        run: go test ./...
      - name: Fetch, validate, and paginate pinned source
        id: batches
        env:
          SOURCE_REVISION: 88706670ac0ffaad7bf3c6307747e2515f638bed
          EXPECTED_LEADS: ${{ inputs.expected_leads || '2284' }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        shell: bash
        run: |
          set -euo pipefail
          # Python tests run from the repository root; Go commands run from their module root.
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/scripts/tests" -p "test_catalogue_high_priority_research.py" -v
          curl --fail --location --silent --show-error --retry 3 "https://raw.githubusercontent.com/public-apis/public-apis/$SOURCE_REVISION/README.md" -o "$RUNNER_TEMP/source.md"

          expected="$EXPECTED_LEADS"
          if ! [[ "$expected" =~ ^[1-9][0-9]*$ ]] || (( expected > 50000 )); then
            echo "expected_leads must be between 1 and 50000" >&2
            exit 1
          fi
          if ! [[ "$BATCH_SIZE" =~ ^[1-9][0-9]*$ ]] || (( BATCH_SIZE > 200 )); then
            echo "batch_size must be between 1 and 200" >&2
            exit 1
          fi

          pushd "$GITHUB_WORKSPACE/services/catalogue-importer" >/dev/null
          go run ./cmd/catalogue-discover -input "$RUNNER_TEMP/source.md" -directory-url "https://github.com/public-apis/public-apis" -revision "$SOURCE_REVISION" -output "$RUNNER_TEMP/discovery.json"
          go run ./cmd/catalogue-triage -input "$RUNNER_TEMP/discovery.json" -output "$RUNNER_TEMP/triage.json"

          # review-pack intentionally caps one page at 500; concatenate pages to build the full queue.
          mkdir -p "$RUNNER_TEMP/queue-parts"
          for ((offset=0; offset<expected; offset+=500)); do
            limit=$(( expected - offset ))
            (( limit > 500 )) && limit=500
            go run ./cmd/catalogue-review-pack -input "$RUNNER_TEMP/triage.json" -offset "$offset" -limit "$limit" -output "$RUNNER_TEMP/queue-parts/page-$offset.json"
          done
          popd >/dev/null

          python3 - "$RUNNER_TEMP/discovery.json" "$RUNNER_TEMP/triage.json" "$RUNNER_TEMP/queue-parts" "$RUNNER_TEMP/queue.json" "$expected" "$BATCH_SIZE" "$GITHUB_OUTPUT" <<'PY'
          import glob, json, math, os, sys
          discovery_path,triage_path,parts_dir,queue_path=sys.argv[1:5]
          expected,size=int(sys.argv[5]),int(sys.argv[6])
          discovery=json.load(open(discovery_path,encoding="utf-8"))
          triage=json.load(open(triage_path,encoding="utf-8"))
          if triage.get("processed") != len(triage.get("candidates", [])):
              raise SystemExit("triage processed/candidate count mismatch")
          if triage["processed"] < expected:
              raise SystemExit(f"triage produced {triage['processed']} candidates; expected at least {expected}")
          candidates=[]
          paths=sorted(glob.glob(os.path.join(parts_dir,"page-*.json")),key=lambda p:int(os.path.basename(p).split("-")[1].split(".")[0]))
          for path in paths:
              page=json.load(open(path,encoding="utf-8"))
              if page.get("returned") != len(page.get("candidates", [])):
                  raise SystemExit(f"review-pack count mismatch in {os.path.basename(path)}")
              candidates.extend(page.get("candidates",[]))
          ids=[x.get("reviewId") for x in candidates]
          if len(candidates)!=expected or len(set(ids))!=expected or any(not x for x in ids):
              raise SystemExit(f"queue integrity failed: expected {expected} unique review IDs, got {len(candidates)} records / {len(set(ids))} unique IDs")
          queue={"generatedAt":triage.get("generatedAt"),"sourceRevision":"88706670ac0ffaad7bf3c6307747e2515f638bed","sourceTotal":discovery.get("total"),"candidates":candidates}
          with open(queue_path,"w",encoding="utf-8") as out: json.dump(queue,out,indent=2)
          matrix={"include":[{"batch":i,"offset":i*size,"limit":min(size,expected-i*size)} for i in range(math.ceil(expected/size))]}
          with open(sys.argv[7],"a",encoding="utf-8") as out: out.write("matrix="+json.dumps(matrix)+"\\n")
          print(f"Prepared {len(candidates)} unique review-only leads across {len(matrix['include'])} research batches.")
          PY

          mkdir -p "$RUNNER_TEMP/queue-artifact"
          cp "$RUNNER_TEMP/discovery.json" "$RUNNER_TEMP/triage.json" "$RUNNER_TEMP/queue.json" "$RUNNER_TEMP/queue-artifact/"
      - uses: actions/upload-artifact@v7
        with:
          name: apivault-discovery-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-artifact/
          if-no-files-found: error
          retention-days: 90

  research:
    name: Research batch ${{ matrix.batch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.batches) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: apivault-discovery-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/queue
      - name: Build batch and run bounded research
        env:
          OFFSET: ${{ matrix.offset }}
          LIMIT: ${{ matrix.limit }}
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/queue/queue.json" "$OFFSET" "$LIMIT" "$RUNNER_TEMP/batch.json" <<'PY'
          import json,sys
          items=json.load(open(sys.argv[1],encoding="utf-8"))["candidates"]
          offset,limit=int(sys.argv[2]),int(sys.argv[3])
          batch=items[offset:offset+limit]
          if len(batch)!=limit: raise SystemExit(f"batch slice mismatch: expected {limit}, got {len(batch)}")
          json.dump({"candidates":batch},open(sys.argv[4],"w",encoding="utf-8"))
          PY
          python3 scripts/catalogue-high-priority-research.py --input "$RUNNER_TEMP/batch.json" --workers 12 --max-pages-per-host 0 --timeout 5 --retries 1 --output "$RUNNER_TEMP/research-$BATCH.json"
          python3 - "$RUNNER_TEMP/research-$BATCH.json" "$LIMIT" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          if report["leadCount"]!=int(sys.argv[2]): raise SystemExit("batch count mismatch")
          if len({x.get("reviewId") for x in report["records"]})!=report["leadCount"]: raise SystemExit("duplicate or missing review IDs in batch")
          if any(x.get("importEligible") is not False or x.get("verificationStatus")!="UNVERIFIED" or x.get("publicationStatus")!="NOT_PUBLISHED" for x in report["records"]): raise SystemExit("human-review gate failed")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: apivault-research-batch-${{ github.run_id }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/research-${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 90
