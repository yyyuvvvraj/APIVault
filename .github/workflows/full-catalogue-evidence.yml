name: Full catalogue evidence processing

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/full-catalogue-evidence.yml"
  workflow_dispatch:
    inputs:
      expected_leads:
        description: Expected number of pinned discovery leads (safety check)
        required: true
        default: "2284"
        type: string
      batch_size:
        description: Leads per bounded hostname research batch
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: apivault-full-catalogue-evidence
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable discovery queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.batches.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/catalogue-importer/go.mod
          cache-dependency-path: services/catalogue-importer/go.sum
      - name: Validate tooling
        working-directory: services/catalogue-importer
        run: go test ./...
      - name: Fetch and validate pinned source
        env:
          SOURCE_REVISION: 88706670ac0ffaad7bf3c6307747e2515f638bed
          EXPECTED_LEADS: ${{ inputs.expected_leads || '2284' }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p "test_catalogue_high_priority_research.py" -v
          curl --fail --location --silent --show-error --retry 3 "https://raw.githubusercontent.com/public-apis/public-apis/$SOURCE_REVISION/README.md" -o "$RUNNER_TEMP/source.md"
          go run ./services/catalogue-importer/cmd/catalogue-discover -input "$RUNNER_TEMP/source.md" -directory-url "https://github.com/public-apis/public-apis" -revision "$SOURCE_REVISION" -output "$RUNNER_TEMP/discovery.json"
          go run ./services/catalogue-importer/cmd/catalogue-triage -input "$RUNNER_TEMP/discovery.json" -output "$RUNNER_TEMP/triage.json"
          go run ./services/catalogue-importer/cmd/catalogue-review-pack -input "$RUNNER_TEMP/triage.json" -offset 0 -limit "$EXPECTED_LEADS" -output "$RUNNER_TEMP/queue.json"
          python3 - "$RUNNER_TEMP/queue.json" "$EXPECTED_LEADS" "$BATCH_SIZE" "$GITHUB_OUTPUT" <<'PY'
          import json, math, sys
          queue=json.load(open(sys.argv[1],encoding="utf-8"))["candidates"]
          expected,size=int(sys.argv[2]),int(sys.argv[3])
          if len(queue)!=expected or len({x["reviewId"] for x in queue})!=expected: raise SystemExit("queue count/unique-ID integrity failed")
          if not 1<=size<=200: raise SystemExit("batch_size must be 1..200")
          matrix={"include":[{"batch":i,"offset":i*size,"limit":min(size,expected-i*size)} for i in range(math.ceil(expected/size))]}
          with open(sys.argv[4],"a") as out: out.write("matrix="+json.dumps(matrix)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: apivault-discovery-queue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/discovery.json
            ${{ runner.temp }}/triage.json
            ${{ runner.temp }}/queue.json
          retention-days: 90

  research:
    name: Research batch ${{ matrix.batch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.batches) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: apivault-discovery-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/queue
      - name: Build batch and run bounded research
        env:
          OFFSET: ${{ matrix.offset }}
          LIMIT: ${{ matrix.limit }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/queue/queue.json" "$OFFSET" "$LIMIT" "$RUNNER_TEMP/batch.json" <<'PY'
          import json,sys
          items=json.load(open(sys.argv[1],encoding="utf-8"))["candidates"]
          batch=items[int(sys.argv[2]):int(sys.argv[2])+int(sys.argv[3])]
          json.dump({"candidates":batch},open(sys.argv[4],"w",encoding="utf-8"))
          PY
          python3 scripts/catalogue-high-priority-research.py --input "$RUNNER_TEMP/batch.json" --workers 12 --max-pages-per-host 0 --timeout 5 --retries 1 --output "$RUNNER_TEMP/research-$BATCH.json"
          python3 - "$RUNNER_TEMP/research-$BATCH.json" "$LIMIT" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          if report["leadCount"]!=int(sys.argv[2]): raise SystemExit("batch count mismatch")
          if any(x.get("importEligible") is not False or x.get("verificationStatus")!="UNVERIFIED" or x.get("publicationStatus")!="NOT_PUBLISHED" for x in report["records"]): raise SystemExit("human-review gate failed")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: apivault-research-batch-${{ github.run_id }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/research-${{ matrix.batch }}.json
          retention-days: 90
