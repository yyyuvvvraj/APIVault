name: Go Verifier CI

on:
  pull_request:
    branches: [dev, stable, "feature/**"]
    paths:
      - "services/verifier/**"
      - ".github/workflows/verifier-ci.yml"
  push:
    branches: [dev, stable]
    paths:
      - "services/verifier/**"
      - ".github/workflows/verifier-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build Go verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/verifier/go.mod
          cache-dependency-path: services/verifier/go.mod
      - name: Run unit tests
        working-directory: services/verifier
        run: go test -race -cover ./...
      - name: Static analysis
        working-directory: services/verifier
        run: go vet ./...
      - name: Build Linux binary
        working-directory: services/verifier
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/verifier
      - name: Build Alpine container
        run: docker build -f services/verifier/Dockerfile services/verifier
