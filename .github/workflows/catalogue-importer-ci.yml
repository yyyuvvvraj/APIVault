name: Go Catalogue Importer CI

on:
  pull_request:
    branches: [dev, stable]
    paths:
      - "services/catalogue-importer/**"
      - ".github/workflows/catalogue-importer-ci.yml"
  push:
    branches: [dev, stable]
    paths:
      - "services/catalogue-importer/**"
      - ".github/workflows/catalogue-importer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, test, vet, and build Go importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/catalogue-importer/go.mod
          cache-dependency-path: services/catalogue-importer/go.mod
      - name: Verify gofmt formatting
        working-directory: services/catalogue-importer
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run Go tests
        working-directory: services/catalogue-importer
        run: go test -race -cover ./...
      - name: Run go vet
        working-directory: services/catalogue-importer
        run: go vet ./...
      - name: Build importer
        working-directory: services/catalogue-importer
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/apivault-catalogue-importer ./cmd/catalogue-importer
