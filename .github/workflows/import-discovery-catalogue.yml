name: Import discovery catalogue

on:
  workflow_run:
    workflows: ["Full catalogue evidence processing"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full-catalogue evidence workflow run ID
        required: true
        type: string
      expected_leads:
        description: Expected unique discovery leads
        required: true
        default: "2284"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: apivault-discovery-catalogue-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DISCOVERY_LEADS: ${{ inputs.expected_leads || '2284' }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Require database connection
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Repository secret DATABASE_URL is required to import the discovery queue into the APIVault database."
            exit 1
          fi
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "::error::A successful full-catalogue evidence workflow run is required."
            exit 1
          fi
          if ! [[ "$EXPECTED_DISCOVERY_LEADS" =~ ^[1-9][0-9]*$ ]] || (( EXPECTED_DISCOVERY_LEADS > 50000 )); then
            echo "::error::expected_leads must be between 1 and 50000."
            exit 1
          fi

      - name: Download the immutable discovery queue
        uses: actions/download-artifact@v7
        with:
          name: apivault-discovery-queue-${{ github.event.workflow_run.id || inputs.source_run_id }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/catalogue-artifact

      - name: Download all research batches
        uses: actions/download-artifact@v7
        with:
          pattern: apivault-research-batch-${{ github.event.workflow_run.id || inputs.source_run_id }}-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/research

      - name: Check out application
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate research-to-disposition preparation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p "test_prepare_discovery_disposition.py" -v

      - name: Prepare complete review-only disposition
        run: |
          set -euo pipefail
          python3 scripts/prepare-discovery-disposition.py \
            --queue "$RUNNER_TEMP/catalogue-artifact/queue.json" \
            --research-dir "$RUNNER_TEMP/research" \
            --expected "$EXPECTED_DISCOVERY_LEADS" \
            --output "$RUNNER_TEMP/catalogue-artifact/full-catalogue-disposition.json"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate and import all discovery leads
        run: npx tsx scripts/import-discovery-disposition.ts "$RUNNER_TEMP/catalogue-artifact/full-catalogue-disposition.json"

      - name: Report imported catalogue size
        run: |
          echo "The complete discovery research queue was imported into DiscoveryLead."
          echo "All records remain UNVERIFIED, NOT_PUBLISHED, and require human review."
          echo "No Api, ApiProvider, or ApiSource records were created or modified."
