name: Scheduled encrypted PostgreSQL backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: apivault-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate backup configuration
        env:
          PGHOST: ${{ secrets.APIVAULT_BACKUP_PGHOST }}
          PGUSER: ${{ secrets.APIVAULT_BACKUP_PGUSER }}
          PGDATABASE: ${{ secrets.APIVAULT_BACKUP_PGDATABASE }}
          PGPASSFILE_CONTENT: ${{ secrets.APIVAULT_BACKUP_PGPASSFILE }}
          BACKUP_ENCRYPTION_RECIPIENT: ${{ secrets.APIVAULT_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          for name in PGHOST PGUSER PGDATABASE PGPASSFILE_CONTENT BACKUP_ENCRYPTION_RECIPIENT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret for ${name}."
              exit 1
            fi
          done

      - name: Prepare isolated backup workspace
        env:
          PGPASSFILE_CONTENT: ${{ secrets.APIVAULT_BACKUP_PGPASSFILE }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/apivault-backups"
          printf '%s' "$PGPASSFILE_CONTENT" > "$RUNNER_TEMP/apivault-pgpass"
          chmod 600 "$RUNNER_TEMP/apivault-pgpass"

      - name: Dump and encrypt database
        env:
          PGHOST: ${{ secrets.APIVAULT_BACKUP_PGHOST }}
          PGPORT: ${{ secrets.APIVAULT_BACKUP_PGPORT }}
          PGUSER: ${{ secrets.APIVAULT_BACKUP_PGUSER }}
          PGDATABASE: ${{ secrets.APIVAULT_BACKUP_PGDATABASE }}
          BACKUP_ENCRYPTION_RECIPIENT: ${{ secrets.APIVAULT_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          : "${PGPORT:=5432}"
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE \
            -e PGSSLMODE=require \
            -e PGPASSFILE=/run/secrets/pgpass \
            -e BACKUP_ENCRYPTION_RECIPIENT \
            -e BACKUP_DIR=/backup \
            -e BACKUP_RETENTION_DAYS=14 \
            -v "$RUNNER_TEMP/apivault-pgpass:/run/secrets/pgpass:ro" \
            -v "$RUNNER_TEMP/apivault-backups:/backup" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            postgres:18-bookworm bash -ec \
            'apt-get update -qq && apt-get install -y --no-install-recommends age >/dev/null && bash /scripts/backup-postgres.sh'

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: apivault-encrypted-postgres-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/apivault-backups/*.dump.age
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS credentials for off-site storage
        if: ${{ vars.APIVAULT_BACKUP_AWS_ROLE_ARN != '' && vars.APIVAULT_BACKUP_AWS_REGION != '' && vars.APIVAULT_BACKUP_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.APIVAULT_BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.APIVAULT_BACKUP_AWS_REGION }}
          role-session-name: APIVaultBackup-${{ github.run_id }}

      - name: Copy encrypted backup to off-site S3 storage
        if: ${{ vars.APIVAULT_BACKUP_AWS_ROLE_ARN != '' && vars.APIVAULT_BACKUP_AWS_REGION != '' && vars.APIVAULT_BACKUP_S3_BUCKET != '' }}
        env:
          S3_BUCKET: ${{ vars.APIVAULT_BACKUP_S3_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/apivault-backups/*.dump.age)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No encrypted backup file exists for off-site upload."
            exit 1
          fi

          for file in "${files[@]}"; do
            checksum="$(sha256sum "$file" | awk '{print $1}')"
            key="apivault/postgres/$(basename "$file")"
            destination="s3://${S3_BUCKET}/${key}"
            aws s3 cp "$file" "$destination" --sse AES256 --metadata "sha256=${checksum}" --only-show-errors
            remote_checksum="$(aws s3api head-object --bucket "$S3_BUCKET" --key "$key" --query 'Metadata.sha256' --output text)"
            if [[ "$remote_checksum" != "$checksum" ]]; then
              echo "::error::Off-site backup checksum metadata did not match for $key."
              exit 1
            fi
            echo "Verified encrypted backup at $destination (sha256: $checksum)"
            echo "- Off-site backup: `$destination`" >> "$GITHUB_STEP_SUMMARY"
            echo "- SHA-256: `$checksum`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Explain off-site upload configuration
        if: ${{ vars.APIVAULT_BACKUP_AWS_ROLE_ARN == '' || vars.APIVAULT_BACKUP_AWS_REGION == '' || vars.APIVAULT_BACKUP_S3_BUCKET == '' }}
        shell: bash
        run: |
          echo "::warning::Encrypted backup is available only as a short-lived Actions artifact; durable off-site upload is not configured."
          {
            echo "### Off-site backup not configured"
            echo "Set repository variables `APIVAULT_BACKUP_AWS_ROLE_ARN`, `APIVAULT_BACKUP_AWS_REGION`, and `APIVAULT_BACKUP_S3_BUCKET` to enable OIDC-authenticated S3 upload."
            echo "This run does not satisfy the durable off-site backup acceptance gate."
          } >> "$GITHUB_STEP_SUMMARY"
