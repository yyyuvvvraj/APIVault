name: Docker build and publish

on:
  pull_request:
  push:
    branches: [dev, "feature/**"]
    tags: ["v0.*", "v1.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build, smoke-test, and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify version release tag belongs to stable
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.'))
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stable
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/stable; then
            echo "::error::Version tags must point to a commit already contained in stable."
            exit 1
          fi

      - name: Set up QEMU
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.'))
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/apivault
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.')) }}

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.')))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.'))) }}
          load: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.')) }}
          sbom: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v0.') || startsWith(github.ref, 'refs/tags/v1.')) }}

      - name: Smoke-test the container
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/apivault:${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name apivault-smoke \
            --publish 3000:3000 \
            --env BETTER_AUTH_SECRET=ci-smoke-test-secret-not-for-real-use-123456 \
            --env BETTER_AUTH_URL=http://127.0.0.1:3000 \
            "$IMAGE"

          cleanup() {
            docker logs apivault-smoke || true
            docker rm --force apivault-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "APIVault container responded successfully."
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' apivault-smoke)" != "true" ]; then
              echo "::error::APIVault container exited before becoming ready."
              exit 1
            fi

            sleep 2
          done

          echo "::error::APIVault did not respond within 60 seconds."
          exit 1
